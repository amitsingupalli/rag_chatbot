version: '3.8'

services:
  rag-chatbot:
    build: .
    container_name: rag_chatbot_app
    ports:
      - "8000:8000"
      - "8501:8501"
    volumes:
      # Keeps user uploaded data & vector database persistent on their laptop
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
